# Memgraph: sum of count(DISTINCT file) for methylation_array_file + sequencing_file with a study path
# API: GET /api/v1/file/summary → { "counts": { "total": N } } (both file node types)
id: dcc_file_summary_total
description: >
  Compare Memgraph total file count (methylation_array_file + sequencing_file, study-linked)
  to DCC GET /file/summary counts.total.
tags:
  - memgraph_api
  - smoke
  - regression

cypher_query_key: DCC_TC03_verify_file_summary
cypher_parameters: {}

api:
  method: GET
  path: /file/summary
  query: {}

comparison:
  type: dcc_scalar_match
  graph_scalar_column: total_files
  api_scalar_paths:
    - counts.total
